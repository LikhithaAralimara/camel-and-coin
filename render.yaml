# One host for the whole game: the page, the bots and the online rooms.
#
# Online rooms need a process that stays alive and holds state in memory, which
# is why this exists and why a static host can't cover it. Serving the page from
# the same service also means loading the site is what wakes it, so a free-tier
# instance is already warm by the time anyone opens a room.
services:
  - type: web
    name: camel-and-coin
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: node server.js
    healthCheckPath: /api/rules
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      # This deploy serves its own rooms, so the client talks to its own origin.
      - key: ROOM_SERVER_URL
        value: same-origin
